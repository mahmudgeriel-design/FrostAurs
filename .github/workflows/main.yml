name: Build FrostAurs

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Download fresh and working Paper API
      run: |
        mkdir -p FrostAurs/libs
        curl -L -o FrostAurs/libs/paper-api.jar https://papermc.io

    - name: Build with Maven
      run: mvn -B package --file FrostAurs/pom.xml

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SoulShop-Plugin
        path: FrostAurs/target/*.jar
